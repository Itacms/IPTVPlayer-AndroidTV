name: Compilar APK Automaticamente

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar código fonte
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Dar permissão ao gradlew
        run: chmod +x gradlew

      - name: Gerar versão automática
        run: |
          echo "APP_VERSION_CODE=$(( ${{ github.run_number }} + 200 ))" >> $GITHUB_ENV
          echo "APP_VERSION_NAME=1.2.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug -PAPP_VERSION_CODE=$APP_VERSION_CODE -PAPP_VERSION_NAME=$APP_VERSION_NAME

      - name: Preparar chave de assinatura (se houver secrets)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/release.keystore
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Compilar APK Release assinado (se houver chave)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: ./gradlew assembleRelease -PAPP_VERSION_CODE=$APP_VERSION_CODE -PAPP_VERSION_NAME=$APP_VERSION_NAME

      - name: Enviar APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-Debug-v${{ env.APP_VERSION_NAME }}-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Enviar APK Release assinado
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-Release-v${{ env.APP_VERSION_NAME }}-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
