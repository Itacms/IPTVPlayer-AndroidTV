<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player IPTV</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
:root{--bg:#0b0b0d;--panel:#1b1b20;--panel2:#26262d;--txt:#fff;--mut:#a7a7b2;--red:#e5262d}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--txt);font:1.5vw/1.35 Poppins,Montserrat,Roboto,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;text-align:left;cursor:pointer}
button:focus,input:focus{outline:none}
[data-f]{transition:transform .12s,box-shadow .12s,background .12s}
[data-f]:focus{box-shadow:0 0 0 .22vw #fff;transform:scale(1.03);position:relative;z-index:3}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#app{position:relative;z-index:1;display:flex;height:100%}
#rail{width:6.2vw;flex:none;background:#0c0c0f;display:flex;flex-direction:column;align-items:center;padding:3.2vh 0}
.brand{font-weight:800;font-size:1.15vw;letter-spacing:.08em;color:#fff}
.brand b{color:var(--red)}
.ri{flex:1;display:flex;flex-direction:column;gap:3.4vh;align-items:center;margin-top:7vh}
.rb{position:relative;width:4vw;height:4vw;display:grid;place-items:center;border-radius:1vw;color:var(--mut)}
.rb svg{width:2.1vw;height:2.1vw}
.rb.on{color:#fff}
.rb.on::after{content:"";position:absolute;bottom:.2vw;width:1vw;height:.18vw;background:var(--red);border-radius:2px}
.rb:focus{background:#fff;color:#000}

#content{flex:1;min-width:0;display:flex;flex-direction:column}
#tabs{display:flex;gap:.6vw;padding:2.6vh 3vw 0;height:11vh;align-items:flex-start}
.tab{font-size:2vw;font-weight:600;padding:.4vw 1.6vw;border-radius:99px;color:#fff}
.tab.on{background:#e9e9ec;color:#111}
#main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
#main::-webkit-scrollbar{display:none}
#main.live,#main.cfg{overflow:hidden}

/* início */
.hero{position:relative;height:49vh;padding:3vh 3vw 0;display:flex;justify-content:space-between;gap:3vw;
  background:radial-gradient(ellipse at 78% 25%,#3b1217 0,transparent 62%)}
.hx{max-width:56vw}
.hm{font-size:1.5vw;font-weight:600;color:#ddd;display:flex;align-items:center;gap:.8vw}
.badge{background:var(--red);color:#fff;font-size:1vw;font-weight:700;padding:.1vw .6vw;border-radius:.3vw;letter-spacing:.04em}
.hero h1{font-size:4.6vw;line-height:1.08;margin:1.4vh 0;font-weight:800;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero p{margin:0;font-size:1.45vw;color:#d4d4da}
.hl{flex:none;width:25vw;aspect-ratio:16/9;margin-top:1vh;background:#f4f4f6;border-radius:1vw;display:grid;place-items:center;overflow:hidden;box-shadow:0 2vw 5vw #000a}
.hl img{width:74%;height:74%;object-fit:contain}
.hl i,.th i,.glogo i,.plogo i{font-style:normal;font-weight:800;color:#445}
.hl i{font-size:4vw}
.row h2{font-size:1.7vw;margin:1.4vh 3vw 0;font-weight:700}
.strip{display:flex;gap:1.2vw;overflow-x:auto;padding:1.6vh 3vw 2.6vh}
.strip::-webkit-scrollbar{display:none}
.card{flex:none;width:17vw;border-radius:.8vw;position:relative}
.th{display:grid;place-items:center;aspect-ratio:16/9;background:#f4f4f6;border-radius:.8vw;overflow:hidden}
.th img{width:76%;height:76%;object-fit:contain}
.th i{font-size:2.2vw}
.card b{display:block;margin-top:.8vh;font-weight:500;font-size:1.2vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.fav::after{content:"";position:absolute;top:.6vw;right:.6vw;width:1.5vw;height:1.5vw;background:var(--red);border-radius:50%;box-shadow:0 0 0 .2vw #fff}
.grid{display:flex;flex-wrap:wrap;gap:1.6vw 1.2vw;padding:2vh 3vw}
.title{font-size:2.6vw;font-weight:800;margin:1vh 3vw 0}
.sub{margin:.4vh 3vw 0;color:var(--mut)}
.empty{margin:3vh 3vw;color:var(--mut);font-size:1.5vw}

/* ao vivo */
.live{position:relative;height:100%}
.lhead{position:absolute;left:3vw;top:1vh;width:42vw}
.lm{font-size:1.4vw;font-weight:600;color:#ddd;display:flex;align-items:center;gap:.8vw}
.lhead h1{font-size:3.2vw;line-height:1.1;font-weight:800;margin:.6vh 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lhead p{margin:0;font-size:1.35vw;color:#cfcfd6}
.lbody{position:absolute;left:0;right:0;top:36vh;bottom:0;display:flex;gap:1.4vw;padding:0 2vw 0 2.4vw}
.cats{width:19vw;flex:none;overflow-y:auto;padding:.6vh .5vw}
.cats::-webkit-scrollbar,.guide::-webkit-scrollbar{display:none}
.cat{display:block;width:100%;padding:1.1vh 1.1vw;border-radius:.7vw;margin-bottom:.8vh;color:#b9b9c2;font-size:1.45vw;font-weight:600}
.cat small{display:block;font-size:1vw;font-weight:400;color:var(--mut)}
.cat.on{background:var(--panel);color:#fff}
.guide{flex:1;overflow-y:auto;padding:.6vh .5vw}
.grow{display:flex;gap:.7vw;width:100%;height:8.2vh;margin-bottom:1vh;border-radius:.5vw}
.glogo{width:9vw;flex:none;background:var(--panel);border-radius:.5vw;display:grid;place-items:center;overflow:hidden}
.glogo img{max-width:72%;max-height:72%;object-fit:contain}
.glogo i{font-size:1.6vw;color:#ccd}
.gbar{flex:1;min-width:0;background:var(--panel);border-radius:.5vw;display:flex;align-items:center;gap:1.4vw;padding:0 1.4vw;position:relative;overflow:hidden}
.gbar b{font-weight:500;font-size:1.45vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar small{color:var(--mut);font-size:1.1vw;white-space:nowrap;margin-left:auto}
.gbar::after{content:"";position:absolute;left:0;bottom:0;height:.5vh;width:var(--p,40%);background:var(--red)}
.grow:focus .gbar,.grow:focus .glogo{background:var(--panel2)}

/* vídeo */
#v{display:none;background:#000}
#v.mini{display:block;position:fixed;z-index:0;top:0;right:0;width:56vw;height:36vh;object-fit:cover;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 28%);mask-image:linear-gradient(90deg,transparent 0,#000 28%)}
#v.full{display:block;position:fixed;z-index:8;inset:0;width:100%;height:100%;object-fit:contain}
#pov{position:fixed;inset:0;z-index:9;display:none}
#pov.on{display:block}
#pmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:4vw;font-size:1.8vw;pointer-events:none}
#pmsg.err{color:#ff8a8f}
#pbar{position:absolute;left:0;right:0;bottom:0;padding:9vh 4vw 4.5vh;background:linear-gradient(0deg,#000e 20%,transparent);display:flex;gap:3vw;align-items:flex-end;transition:opacity .4s}
#pbar.off{opacity:0}
.pl{flex:1;min-width:0;display:flex;gap:1.6vw;align-items:center}
.plogo{width:11vw;aspect-ratio:16/9;flex:none;background:#f4f4f6;border-radius:.6vw;display:grid;place-items:center;overflow:hidden}
.plogo img{width:76%;height:76%;object-fit:contain}
.pt{flex:1;min-width:0}
.pt h2{margin:0;font-size:2.6vw;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt .pm{display:flex;align-items:center;gap:.8vw;font-size:1.4vw}
.pline{height:.5vh;background:#ffffff40;border-radius:9px;margin:1.2vh 0;overflow:hidden}
.pline i{display:block;height:100%;width:60%;background:var(--red)}
.pt small{color:#d0d0d6;font-size:1.15vw}
.heart{width:3vw;height:3vw;flex:none;color:#fff}
.heart svg{width:100%;height:100%}
.heart.on svg{fill:var(--red);stroke:var(--red)}
.pmore{flex:none;width:36vw}
.pmore h3{margin:0 0 1vh;font-size:1.9vw;font-weight:700}
#pmc{display:flex;gap:.8vw}
#pmc div{width:8.2vw;aspect-ratio:16/9;background:#f4f4f6;border-radius:.5vw;display:grid;place-items:center;overflow:hidden}
#pmc img{width:78%;height:78%;object-fit:contain}
#pmc i{font-style:normal;font-weight:800;color:#445;font-size:1.3vw}

/* busca e configurações */
.field{margin:2.4vh 3vw 0;display:flex;gap:1.2vw;align-items:center}
input{flex:1;min-width:0;background:var(--panel);border:.15vw solid #33333b;border-radius:.8vw;padding:1.4vh 1.4vw}
input:focus{border-color:#fff}
.pill{padding:1.3vh 2.4vw;border-radius:99px;background:var(--panel2);font-weight:600}
.pill.main{background:#fff;color:#111}
#toast{position:fixed;top:3vh;right:3vw;z-index:20;background:#fff;color:#111;padding:1vh 1.8vw;border-radius:99px;font-weight:600;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
</style>
</head>
<body>
<video id="v" playsinline muted></video>

<div id="app">
  <nav id="rail">
    <div class="brand">IP<b>TV</b></div>
    <div class="ri">
      <button class="rb" data-f data-v="home" aria-label="Início"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg></button>
      <button class="rb" data-f data-v="search" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg></button>
      <button class="rb" data-f data-v="favs" aria-label="Favoritos"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M10 10.5v5l4.5-2.5z"/><path d="M6 3.5h12"/></svg></button>
    </div>
    <button class="rb" data-f data-v="cfg" aria-label="Configurações"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="3.4 2.8"/></svg></button>
  </nav>
  <div id="content">
    <header id="tabs">
      <button class="tab" data-f data-v="home">Início</button>
      <button class="tab" data-f data-v="live">Ao Vivo</button>
      <button class="tab" data-f data-v="favs">Favoritos</button>
    </header>
    <div id="main"></div>
  </div>
</div>

<div id="pov">
  <div id="pmsg"></div>
  <div id="pbar" class="off">
    <div class="pl">
      <div class="plogo" id="plogo"></div>
      <div class="pt"><h2 id="pn"></h2><div class="pm"><span class="badge">AO VIVO</span><span id="pg"></span></div><div class="pline"><i></i></div><small>Pressione cima ou baixo para mudar de canal · OK para favoritar</small></div>
      <div class="heart" id="ph"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.4-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.6-8 11-8 11z"/></svg></div>
    </div>
    <div class="pmore"><h3>Mais Canais</h3><div id="pmc"></div></div>
  </div>
</div>
<div id="toast"></div>

<script>
/* Para já abrir com a sua lista, coloque o endereço entre as aspas abaixo: */
const DEFAULT_LIST='';

const $=s=>document.querySelector(s), main=$('#main'), v=$('#v'), pov=$('#pov');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}},set(k,x){try{localStorage.setItem(k,JSON.stringify(x))}catch(e){}}};

let ch=[], favs=new Set(store.get('tv_favs',[])), recent=store.get('tv_recent',[]);
let view='home', rows=[], ctx=[], cur=-1, loaded=-1, mode='off', hls=null, cat='Recentes', tmr=0, itmr=0, lastFocus=-1;
const HEART='<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.4-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.6-8 11-8 11z"/></svg>';

/* ---------- lista M3U ---------- */
function parseM3U(text){
  const out=[];let info=null;
  for(const raw of text.split(/\r?\n/)){
    const l=raw.trim();if(!l)continue;
    if(l.startsWith('#EXTINF')){
      const at=n=>{const m=l.match(new RegExp(n+'="([^"]*)"','i'));return m?m[1]:''};
      info={name:(l.split(/,(.*)$/)[1]||at('tvg-name')||'Sem nome').trim(),logo:at('tvg-logo'),group:at('group-title')};
    }else if(!l.startsWith('#')){
      if(info){out.push({...info,url:l});info=null}
      else if(/^(https?|rtmp|rtsp):/.test(l))out.push({name:l,logo:'',group:'',url:l});
    }
  }
  return out;
}
function setList(text){
  const a=parseM3U(text);if(!a.length)return false;
  ch=a;store.set('tv_list',text.length<4e6?text:'');return true;
}
const byUrl=u=>ch.findIndex(c=>c.url===u);
const clean=n=>n.replace(/^\d+\s*/,'');
const initials=n=>(clean(n).match(/[A-Za-zÀ-ú0-9]/g)||['?']).slice(0,2).join('').toUpperCase();
const logoHTML=c=>c.logo?`<img src="${esc(c.logo)}" alt="" onerror="this.replaceWith(document.createTextNode('${initials(c.name)}'))">`:`<i>${initials(c.name)}</i>`;
const prog=i=>20+((i*37)%61);

function cats(){
  const rec=recent.map(byUrl).filter(i=>i>=0), fv=[...favs].map(byUrl).filter(i=>i>=0);
  const out=[];
  if(rec.length)out.push({k:'Recentes',idx:rec});
  out.push({k:'Favoritos',idx:fv});
  const g=new Map();
  ch.forEach((c,i)=>{const k=c.group||'';if(!g.has(k))g.set(k,[]);g.get(k).push(i)});
  if(g.size<=1){
    const all=[...ch.keys()],num=i=>(ch[i].name.match(/^(\d+)/)||[])[1];
    for(let s=0;s<all.length;s+=25){
      const p=all.slice(s,s+25),a=num(p[0]),b=num(p[p.length-1]);
      out.push({k:a&&b?`Canais ${a} a ${b}`:`Canais ${s+1} a ${s+p.length}`,idx:p});
    }
  }else{
    [...g.entries()].sort((x,y)=>x[0].localeCompare(y[0],'pt')).forEach(([k,idx])=>out.push({k:k||'Outros',idx}));
  }
  return out;
}

/* ---------- telas ---------- */
function card(i,r){
  const c=ch[i];
  return `<button class="card ${favs.has(c.url)?'fav':''}" data-f data-i="${i}" data-r="${r}"><span class="th">${logoHTML(c)}</span><b>${esc(c.name)}</b></button>`;
}
function rowHTML(title,idx){
  idx=idx.slice(0,80);const r=rows.push(idx)-1;
  return `<section class="row"><h2>${esc(title)}</h2><div class="strip">${idx.map(i=>card(i,r)).join('')}</div></section>`;
}
function gridHTML(idx){
  idx=idx.slice(0,120);const r=rows.push(idx)-1;
  return `<div class="grid">${idx.map(i=>card(i,r)).join('')}</div>`;
}
function render(){
  rows=[];main.className=view;
  document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  ({home:renderHome,live:renderLive,favs:renderFavs,search:renderSearch,cfg:renderCfg})[view]();
}
function heroSet(i){
  const c=ch[i];if(!$('#ht'))return;
  $('#ht').textContent=clean(c.name);
  $('#hm').innerHTML=`<span class="badge">AO VIVO</span>${esc(c.group||'Canal de TV')}`;
  $('#hd').textContent=`Assista agora a ${clean(c.name)} ao vivo.`;
  $('#hl').innerHTML=logoHTML(c);
}
function renderHome(){
  if(!ch.length){
    main.innerHTML=`<div class="title" style="margin-top:6vh;font-size:3.6vw">Nenhuma lista carregada</div><div class="sub">Carregue sua lista M3U para ver os canais.</div><div class="field"><button class="pill main" data-f data-v="cfg">Carregar lista</button></div>`;
    return;
  }
  const rec=recent.map(byUrl).filter(i=>i>=0), fi=rec.length?rec[0]:0;
  main.innerHTML=`<div class="hero"><div class="hx"><div class="hm" id="hm"></div><h1 id="ht"></h1><p id="hd"></p></div><div class="hl" id="hl"></div></div>`+
    cats().filter(c=>c.idx.length).map(c=>rowHTML(c.k==='Recentes'?'Assistidos recentemente':c.k,c.idx)).join('');
  heroSet(fi);
}
function renderFavs(){
  const fl=[...favs].map(byUrl).filter(i=>i>=0);
  main.innerHTML=`<div class="title">Favoritos</div><div class="sub">${fl.length} canais</div>`+(fl.length?gridHTML(fl):`<div class="empty">Nenhum favorito ainda. Durante a reprodução, aperte OK para favoritar o canal.</div>`);
}
function renderSearch(){
  main.innerHTML=`<div class="title">Buscar canais</div><div class="field"><input id="q" type="search" placeholder="Digite o nome do canal" autocomplete="off"></div><div id="res"></div>`;
  $('#q').addEventListener('input',()=>{
    const q=$('#q').value.trim().toLowerCase();rows=[];
    const idx=q?ch.map((c,i)=>i).filter(i=>ch[i].name.toLowerCase().includes(q)):[];
    $('#res').innerHTML=q?(idx.length?gridHTML(idx):'<div class="empty">Nenhum canal encontrado.</div>'):'';
  });
}
function renderCfg(){
  main.innerHTML=`<div class="title">Lista de canais</div><div class="sub">${ch.length?ch.length+' canais carregados':'Nenhuma lista carregada'}</div>
  <div class="field"><input id="url" type="url" placeholder="https://exemplo.com/lista.m3u" value="${esc(store.get('tv_url',''))}"><button class="pill main" data-f id="bload">Carregar</button><button class="pill" data-f id="bclear">Remover</button></div>
  <div class="sub" id="lmsg" style="margin-top:2.4vh"></div>`;
}
const lmsg=(t,e)=>{const m=$('#lmsg');if(m){m.textContent=t;m.style.color=e?'#ff8a8f':'var(--mut)'}};
async function loadUrl(u){
  lmsg('Baixando lista…');
  try{
    const r=await fetch(u);if(!r.ok)throw 0;
    if(!setList(await r.text())){lmsg('Nenhum canal encontrado nessa lista.',1);return false}
    store.set('tv_url',u);return true;
  }catch(e){lmsg('Não foi possível baixar a lista. Confira o endereço e a internet da TV.',1);return false}
}

/* ao vivo */
function renderLive(){
  const cs=cats();
  if(!cs.some(c=>c.k===cat))cat=(cs.find(c=>c.idx.length)||cs[0]).k;
  main.innerHTML=`<div class="live"><div class="lhead"><div class="lm" id="lm"></div><h1 id="lt"></h1><p id="ld"></p></div><div class="lbody"><div class="cats">${cs.map(c=>`<button class="cat ${c.k===cat?'on':''}" data-f data-cat="${esc(c.k)}">${esc(c.k)}<small>${c.idx.length} canais</small></button>`).join('')}</div><div class="guide" id="gd"></div></div></div>`;
  fillGuide();
  const f=ctx.includes(cur)?cur:ctx[0];if(f!==undefined)setLiveInfo(f);
}
function fillGuide(){
  const c=cats().find(c=>c.k===cat);ctx=c?c.idx.slice(0,150):[];
  $('#gd').innerHTML=ctx.length?ctx.map(i=>{const x=ch[i];return `<button class="grow" data-f data-i="${i}"><span class="glogo">${logoHTML(x)}</span><span class="gbar" style="--p:${prog(i)}%"><b>${esc(x.name)}</b><small>${esc(x.group||'Ao vivo')}</small></span></button>`}).join(''):'<div class="empty">Nenhum canal aqui ainda.</div>';
}
function setLiveInfo(i){
  const c=ch[i];if(!c||!$('#lt'))return;
  $('#lm').innerHTML=`<span class="badge">AO VIVO</span>${esc(c.group||'Canal de TV')}`;
  $('#lt').textContent=clean(c.name);
  $('#ld').textContent='Pressione OK para assistir em tela cheia.';
}
function previewSoon(i){
  setLiveInfo(i);clearTimeout(tmr);
  tmr=setTimeout(()=>{if(view==='live'&&mode!=='full'){cur=i;load(i);setMode('mini')}},700);
}

/* ---------- player ---------- */
const pm=(t,e)=>{const m=$('#pmsg');m.textContent=t;m.className=e?'err':''};
function load(i){
  if(loaded===i&&(hls||v.getAttribute('src')))return;
  loaded=i;const c=ch[i];
  if(hls){hls.destroy();hls=null}
  pm('Carregando…');
  const isHls=/\.m3u8(\?|$)/i.test(c.url)||/\/live\//i.test(c.url);
  if(isHls&&window.Hls&&Hls.isSupported()){
    hls=new Hls({lowLatencyMode:true});hls.loadSource(c.url);hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));
    hls.on(Hls.Events.ERROR,(e,d)=>{if(!d.fatal)return;hls.destroy();hls=null;v.src=c.url;v.play().catch(()=>{})});
  }else{v.src=c.url;v.play().catch(()=>{})}
}
function stop(){
  if(hls){hls.destroy();hls=null}
  v.pause();v.removeAttribute('src');v.load();loaded=-1;
}
function setMode(m){
  mode=m;v.className=m==='off'?'':m;pov.classList.toggle('on',m==='full');v.muted=m!=='full';
  if(m==='off')stop();else v.play().catch(()=>{});
}
v.addEventListener('playing',()=>pm(''));
v.addEventListener('error',()=>{if(!hls&&v.getAttribute('src'))pm('Este canal não abriu. Use cima ou baixo para trocar de canal.',1)});
function remember(i){recent=[ch[i].url,...recent.filter(u=>u!==ch[i].url)].slice(0,15);store.set('tv_recent',recent)}
function openFull(i){
  cur=i;lastFocus=i;load(i);remember(i);setMode('full');
  if(document.activeElement)document.activeElement.blur();
  showInfo(i);
}
function zap(d){
  if(ctx.length<2)return;
  const p=ctx.indexOf(cur);cur=ctx[(p+d+ctx.length)%ctx.length];lastFocus=cur;
  load(cur);remember(cur);showInfo(cur);
}
function showInfo(i){
  const c=ch[i];
  $('#plogo').innerHTML=logoHTML(c);$('#pn').textContent=clean(c.name);$('#pg').textContent=c.group||'Canal de TV';
  $('#ph').classList.toggle('on',favs.has(c.url));
  const p=ctx.indexOf(i);let more='';
  for(let k=1;k<=4&&ctx.length>1;k++){const x=ch[ctx[(p+k)%ctx.length]];more+=`<div>${logoHTML(x)}</div>`}
  $('#pmc').innerHTML=more;
  const b=$('#pbar');b.classList.remove('off');clearTimeout(itmr);itmr=setTimeout(()=>b.classList.add('off'),5000);
}
function closeFull(){
  setMode(view==='live'?'mini':'off');
  if(view!=='live')render();
  focusEl(main.querySelector(`[data-i="${lastFocus}"]`)||main.querySelector('[data-f]'));
}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1800)}
function toggleFav(i){
  const u=ch[i].url;
  if(favs.has(u)){favs.delete(u);toast('Removido dos favoritos')}else{favs.add(u);toast('Adicionado aos favoritos')}
  store.set('tv_favs',[...favs]);$('#ph').classList.toggle('on',favs.has(u));
}
window.onBack=()=>{
  if(mode==='full'){closeFull();return true}
  if(view!=='home'){go('home');return true}
  return false;
};

/* ---------- navegação por controle remoto ---------- */
function focusEl(el){if(!el)return;el.focus({preventScroll:true});el.scrollIntoView({block:'nearest',inline:'nearest'})}
function move(dir){
  const cur=document.activeElement;
  const els=[...document.querySelectorAll('[data-f],input')].filter(e=>e.offsetParent!==null);
  if(!cur||!els.includes(cur)){focusEl(els.find(e=>main.contains(e))||els[0]);return}
  if(cur.classList.contains('grow')&&dir==='L'){focusEl(document.querySelector('.cat.on'));return}
  if(cur.classList.contains('cat')&&dir==='R'){focusEl(document.querySelector('.grow'));return}
  const c=cur.getBoundingClientRect(),cx=c.left+c.width/2,cy=c.top+c.height/2;
  let best=null,bs=1e9;
  for(const e of els){
    if(e===cur)continue;
    const r=e.getBoundingClientRect(),dx=r.left+r.width/2-cx,dy=r.top+r.height/2-cy;let s;
    if(dir==='R'&&dx>8)s=dx+Math.abs(dy)*3;
    else if(dir==='L'&&dx<-8)s=-dx+Math.abs(dy)*3;
    else if(dir==='D'&&dy>8)s=dy+Math.abs(dx)*1.5;
    else if(dir==='U'&&dy<-8)s=-dy+Math.abs(dx)*1.5;
    else continue;
    if(s<bs){bs=s;best=e}
  }
  focusEl(best);
}
document.addEventListener('keydown',e=>{
  if(mode==='full'){
    if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();closeFull();return}
    if(e.key==='ArrowUp'||e.key==='ChannelUp'||e.key==='PageUp'){e.preventDefault();zap(-1)}
    else if(e.key==='ArrowDown'||e.key==='ChannelDown'||e.key==='PageDown'){e.preventDefault();zap(1)}
    else if(e.key==='Enter'){e.preventDefault();toggleFav(cur);showInfo(cur)}
    else showInfo(cur);
    return;
  }
  const typing=document.activeElement&&document.activeElement.tagName==='INPUT';
  const map={ArrowRight:'R',ArrowLeft:'L',ArrowDown:'D',ArrowUp:'U'};
  if(map[e.key]){
    if(typing&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))return;
    e.preventDefault();move(map[e.key]);return;
  }
  if(e.key==='Escape'||(e.key==='Backspace'&&!typing)){e.preventDefault();onBack()}
});
document.addEventListener('focusin',e=>{
  const t=e.target;
  if(view==='live'){
    if(t.dataset.cat!==undefined&&t.dataset.cat!==cat){
      cat=t.dataset.cat;document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('on',b===t));fillGuide();
    }else if(t.dataset.i!==undefined)previewSoon(+t.dataset.i);
  }else if(view==='home'&&t.dataset.i!==undefined)heroSet(+t.dataset.i);
});

/* ---------- ações ---------- */
function go(name){
  clearTimeout(tmr);
  if(mode!=='off')setMode('off');
  view=name;render();
  focusEl(main.querySelector('.grow,[data-i],input,[data-f]')||document.querySelector('.rb'));
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.v){go(t.dataset.v);return}
  if(t.dataset.cat!==undefined){focusEl(document.querySelector('.grow'));return}
  if(t.dataset.i!==undefined){
    if(t.dataset.r!==undefined)ctx=rows[+t.dataset.r]||[+t.dataset.i];
    openFull(+t.dataset.i);return;
  }
  if(t.id==='bload'){
    const u=$('#url').value.trim();if(!u){lmsg('Digite o endereço da lista.',1);return}
    loadUrl(u).then(ok=>{if(ok)go('home')});return;
  }
  if(t.id==='bclear'){ch=[];store.set('tv_list','');store.set('tv_url','');renderCfg();focusEl($('#bload'))}
});

/* ---------- início ---------- */
(async()=>{
  const q=new URLSearchParams(location.search).get('lista');
  const saved=store.get('tv_list','');
  if(q)await loadUrl(q);
  else if(saved)setList(saved);
  else if(DEFAULT_LIST)await loadUrl(DEFAULT_LIST);
  render();
  focusEl(main.querySelector('[data-i],[data-f]')||document.querySelector('.rb'));
})();
</script>
