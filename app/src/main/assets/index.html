<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player IPTV</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
:root{--glass-bg:rgba(255,255,255,.12);--ui-opacity:1;--logo-opacity:1;--logo-bg:#17171c;--logo-fg:#cfd3dd;--logo-sh:none;--bg:#0b0b0d;--panel:#1b1b20;--panel2:#26262d;--txt:#fff;--mut:#a7a7b2;--red:#e5262d;--txt2:#dcdce2;--rail:#0c0c0f;--ring:#ffffff;--tabon:#e9e9ec;--tabfg:#111111;--line:#33333b;--glow:#e5262d55;--card-w:17vw;--card-ar:16 / 9}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--txt);font:1.5vw/1.35 Poppins,Montserrat,Roboto,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;text-align:left;cursor:pointer}
button:focus,input:focus{outline:none}
[data-f]{transition:transform .12s,box-shadow .12s,background .12s}
[data-f]:focus{box-shadow:0 0 0 .22vw var(--ring);transform:scale(1.03);position:relative;z-index:3}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#app{position:relative;z-index:1;display:flex;height:100%}
#rail{width:6.2vw;flex:none;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:3.2vh 0}
.brand{font-weight:800;font-size:1.15vw;letter-spacing:.08em;color:var(--txt)}
.brand b{color:var(--red)}
.ri{flex:1;display:flex;flex-direction:column;gap:3.4vh;align-items:center;margin-top:7vh}
.rb{position:relative;width:4vw;height:4vw;display:grid;place-items:center;border-radius:1vw;color:var(--mut)}
.rb svg{width:2.1vw;height:2.1vw}
.rb.on{color:var(--txt)}
.rb.on::after{content:"";position:absolute;bottom:.2vw;width:1vw;height:.18vw;background:var(--red);border-radius:2px}
.rb:focus{background:var(--ring);color:var(--bg)}

#content{flex:1;min-width:0;display:flex;flex-direction:column}
#tabs{display:flex;gap:.6vw;padding:2.6vh 3vw 0;height:11vh;align-items:flex-start}
.tab{font-size:2vw;font-weight:600;padding:.4vw 1.6vw;border-radius:99px;color:var(--txt)}
.tab.on{background:var(--tabon);color:var(--tabfg)}
#main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
#main::-webkit-scrollbar{display:none}
#main.live,#main.guide{overflow:hidden}

/* início */
.hero{position:relative;height:49vh;padding:3vh 3vw 0;display:flex;justify-content:space-between;gap:3vw;
  background:radial-gradient(ellipse at 78% 25%,var(--glow) 0,transparent 62%)}
.hx{max-width:56vw}
.hm{font-size:1.5vw;font-weight:600;color:var(--txt2);display:flex;align-items:center;gap:.8vw}
.badge{background:var(--red);color:#fff;font-size:1vw;font-weight:700;padding:.1vw .6vw;border-radius:.3vw;letter-spacing:.04em}
.hero h1{font-size:4.6vw;line-height:1.08;margin:1.4vh 0;font-weight:800;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero p{margin:0;font-size:1.45vw;color:var(--txt2)}
.hl{flex:none;width:25vw;aspect-ratio:16/9;margin-top:1vh;background:var(--logo-bg);border-radius:1vw;display:grid;place-items:center;overflow:hidden;box-shadow:var(--logo-sh)}
.hl img{width:74%;height:74%;object-fit:contain}
.hl i,.th i,.glogo i,.plogo i{font-style:normal;font-weight:800;color:var(--logo-fg)}
.hl i{font-size:4vw}
.row h2{font-size:1.7vw;margin:1.4vh 3vw 0;font-weight:700}
.strip{display:flex;gap:1.2vw;overflow-x:auto;padding:1.6vh 3vw 2.6vh}
.strip::-webkit-scrollbar{display:none}
.card{flex:none;width:var(--card-w);border-radius:.8vw;position:relative}
.th{display:grid;place-items:center;aspect-ratio:var(--card-ar);background:var(--logo-bg);border-radius:.8vw;overflow:hidden}
.th img{width:76%;height:76%;object-fit:contain}
.th i{font-size:2.2vw}
.card b{display:block;margin-top:.8vh;font-weight:500;font-size:1.2vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.fav::after{content:"";position:absolute;top:.6vw;right:.6vw;width:1.5vw;height:1.5vw;background:var(--red);border-radius:50%;box-shadow:0 0 0 .2vw #fff}
.grid{display:flex;flex-wrap:wrap;gap:1.6vw 1.2vw;padding:2vh 3vw}
.srow{margin:1.2vh 3vw 0;display:flex;gap:1vw;align-items:center}
.sn{flex:1;min-width:0;font-size:1.5vw;font-weight:600}
.sn small{display:block;color:var(--mut);font-size:1.1vw;font-weight:400}
.diagbox{margin:1.2vh 3vw 0;padding:1.4vh 1.4vw;background:var(--panel);border-radius:.8vw;font:1.1vw/1.5 monospace;white-space:pre-wrap;word-break:break-all;color:var(--txt2);min-height:2vh}
.diagbox:empty{display:none}
html.droid,html.droid body{background:transparent}
body.nfull #app{visibility:hidden}
#pfade{display:none;position:fixed;z-index:0;top:0;right:0;width:var(--mw,56vw);height:var(--mh,36vh);background:linear-gradient(90deg,var(--bg),transparent 16%);pointer-events:none}
#pfade.on{display:block}
.sec{margin:3.4vh 3vw 0;font-size:1.7vw;font-weight:700}
.title{font-size:2.6vw;font-weight:800;margin:1vh 3vw 0}
.sub{margin:.4vh 3vw 0;color:var(--mut)}
.empty{margin:3vh 3vw;color:var(--mut);font-size:1.5vw}

/* ao vivo */
.live{position:relative;height:100%}
.lhead{position:absolute;left:3vw;top:1vh;width:42vw}
.lm{font-size:1.4vw;font-weight:600;color:var(--txt2);display:flex;align-items:center;gap:.8vw}
.lhead h1{font-size:3.2vw;line-height:1.1;font-weight:800;margin:.6vh 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lhead p{margin:0;font-size:1.35vw;color:var(--txt2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lbody{position:absolute;left:0;right:0;top:48vh;bottom:0;display:flex;gap:1.4vw;padding:0 2vw 0 2.4vw}
.cats{width:19vw;flex:none;overflow-y:auto;padding:.6vh .5vw}
.cats::-webkit-scrollbar,.guide::-webkit-scrollbar{display:none}
.cat{display:block;width:100%;padding:1.1vh 1.1vw;border-radius:.7vw;margin-bottom:.8vh;color:var(--mut);font-size:1.45vw;font-weight:600}
.cat small{display:block;font-size:1vw;font-weight:400;color:var(--mut)}
.cat.on{background:var(--panel);color:var(--txt)}
.guide{flex:1;overflow-y:auto;padding:.6vh .5vw}
.grow{display:flex;gap:.7vw;width:100%;height:7.2vh;margin-bottom:.8vh;border-radius:.5vw}
.glogo{width:9vw;flex:none;background:var(--logo-bg);border-radius:.5vw;display:grid;place-items:center;overflow:hidden}
.glogo img{max-width:72%;max-height:72%;object-fit:contain}
.glogo i{font-size:1.6vw;color:var(--logo-fg)}
.gbar{flex:1;min-width:0;background:var(--panel);border-radius:.5vw;display:flex;align-items:center;gap:1.4vw;padding:0 1.4vw;position:relative;overflow:hidden}
.gbar b{font-weight:500;font-size:1.45vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%;flex:none}
.gbar small{color:var(--mut);font-size:1.1vw;white-space:nowrap;margin-left:auto}
.gbar::after{content:"";position:absolute;left:0;bottom:0;height:.5vh;width:var(--p,40%);background:var(--red)}
.grow:focus .gbar,.grow:focus .glogo{background:var(--panel2)}

/* vídeo */
#v{display:none;background:#000}
#v.mini{display:block;position:fixed;z-index:0;top:0;right:0;width:var(--mw,56vw);height:var(--mh,36vh);object-fit:contain;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16%);mask-image:linear-gradient(90deg,transparent 0,#000 16%)}
#v.full{display:block;position:fixed;z-index:8;inset:0;width:100%;height:100%;object-fit:contain}
#pov{position:fixed;inset:0;z-index:9;display:none;color:#fff}
#pov .pill{background:#ffffff26;color:#fff}
#pov [data-f]:focus{box-shadow:0 0 0 .22vw #fff}
#pov h3{color:#b7b7c2}
#pov.on{display:block}
#pmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:4vw;font-size:1.8vw;pointer-events:none}
#pmsg.err{color:#ff8a8f}
#pbar{position:absolute;left:0;right:0;bottom:0;padding:8vh 4vw 3.5vh;background:linear-gradient(0deg,#000f 35%,transparent);display:flex;flex-direction:column;gap:1vh;transition:opacity .4s}
#pbar.off{opacity:0}
.pl{flex:1;min-width:0;display:flex;gap:1.6vw;align-items:center}
.plogo{width:11vw;aspect-ratio:16/9;flex:none;background:var(--logo-bg);border-radius:.6vw;display:grid;place-items:center;overflow:hidden}
.plogo img{width:76%;height:76%;object-fit:contain}
.pt{flex:1;min-width:0}
.pt h2{margin:0;font-size:2.6vw;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt .pm{display:flex;align-items:center;gap:.8vw;font-size:1.4vw}
.pline{height:.5vh;background:#ffffff40;border-radius:9px;margin:1.2vh 0;overflow:hidden}
.pline i{display:block;height:100%;width:60%;background:var(--red)}
.pt small{color:#d0d0d6;font-size:1.15vw}
.heart{width:3vw;height:3vw;flex:none;color:#fff}
.heart svg{width:100%;height:100%}
.heart.on svg{fill:var(--red);stroke:var(--red)}
#pmc{display:flex;gap:.8vw;overflow-x:auto;position:relative;padding:1vh .5vw .6vh}
#pmc::-webkit-scrollbar{display:none}
.pc{flex:none;width:11vw;border-radius:.6vw}
.pc .ml{width:100%}
.pc b{display:block;margin-top:.4vh;font-weight:500;font-size:1.1vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc.cur .ml{outline:.22vw solid var(--red)}
.pctl{display:flex;gap:1vw;flex:none}
.pctl .pill{font-size:1.4vw}
.prow{display:flex;justify-content:space-between;align-items:flex-end;gap:3vw}
.grow.fav .glogo::after{content:"";position:absolute;top:.4vw;right:.4vw;width:1vw;height:1vw;background:var(--red);border-radius:50%}
.glogo{position:relative}

#pmenu{position:absolute;left:0;top:0;bottom:0;width:34vw;display:none;flex-direction:column;gap:1.4vh;padding:4vh 2vw;background:linear-gradient(90deg,#000f 55%,#000a 80%,transparent);z-index:3}
#pmenu.on{display:flex}
#pmenu h3{margin:1vh 0 0;font-size:1.5vw;color:var(--mut);font-weight:600}
#pmenu .pill{display:block;width:26vw;font-size:1.4vw}
#mlist{flex:1;overflow-y:auto;min-height:0;padding:.4vh .3vw}
#mlist::-webkit-scrollbar{display:none}
.mi{display:flex;align-items:center;gap:1vw;width:26vw;padding:.8vh .8vw;border-radius:.6vw;margin-bottom:.6vh;background:#ffffff12}
.mi.cur{background:#ffffff30}
.mi b{font-weight:500;font-size:1.35vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml{width:5.5vw;aspect-ratio:16/9;flex:none;background:var(--logo-bg);border-radius:.4vw;display:grid;place-items:center;overflow:hidden}
.ml img{width:76%;height:76%;object-fit:contain}
.ml i{font-style:normal;font-weight:800;color:var(--logo-fg);font-size:1.1vw}

#bgimg{position:fixed;inset:0;z-index:-1;display:none;pointer-events:none}
html.glass-ui .pill,html.glass-ui .tab,html.glass-ui .cat,html.glass-ui .gbar,html.glass-ui .grow .glogo,html.glass-ui .card .th{background:var(--glass-bg)!important;backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border:1px solid #ffffff24}
html.glass-ui #rail,html.glass-ui #tabs,html.glass-ui .gbar,html.glass-ui .diagbox{background:color-mix(in srgb,var(--panel) calc(var(--ui-opacity)*100%),transparent)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.th,.hl,.glogo,.plogo,.ml,.gl{background-color:color-mix(in srgb,var(--logo-bg) calc(var(--logo-opacity)*100%),transparent)!important}
html.noglass .pill,html.noglass .tab,html.noglass .cat,html.noglass .gbar{backdrop-filter:none;-webkit-backdrop-filter:none}
body.nfull #bgimg{display:none!important}
.hx .btns{margin-top:2vh}
.dots{display:flex;gap:.5vw;margin-top:2vh}
.dots i{width:.8vw;height:.8vw;border-radius:99px;background:var(--mut);opacity:.5;transition:width .25s}
.dots i.on{background:var(--red);opacity:1;width:2.2vw}
@keyframes heroIn{from{opacity:0;transform:translateY(1.2vh)}to{opacity:1;transform:none}}
.hero.swap .hx,.hero.swap .hl{animation:heroIn .55s}
html.nonames .card b{display:none}
html.tcover .th img{width:100%;height:100%;object-fit:cover}
.gbar .ep{font-style:normal;color:var(--txt2);font-size:1.2vw;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pe{font-size:1.25vw;color:#e4e4ea;margin-top:.4vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* guia de programação */
.guide{position:relative;height:100%}
.gpills{position:absolute;left:3vw;top:35vh}
.gscroll{position:absolute;left:0;right:0;top:44vh;bottom:0;overflow:auto;scroll-padding-left:18vw;scroll-padding-top:5vh;padding-bottom:3vh}
.gscroll::-webkit-scrollbar{display:none}
.gruler{display:flex;position:sticky;top:0;z-index:4;background:var(--bg);height:4.4vh;width:max-content}
.gcorner{position:sticky;left:0;z-index:5;width:17vw;flex:none;background:var(--bg)}
.gtick{position:absolute;top:.6vh;font-size:1.15vw;color:var(--mut);white-space:nowrap}
.gr{display:flex;height:6.6vh;margin-bottom:.8vh;width:max-content}
.gch{position:sticky;left:0;z-index:3;width:17vw;flex:none;display:flex;align-items:center;gap:.7vw;padding:0 .8vw 0 3vw;background:var(--bg)}
.gl{width:4.6vw;aspect-ratio:16/9;background:var(--logo-bg);border-radius:.4vw;display:grid;place-items:center;overflow:hidden;flex:none}
.gl img{max-width:76%;max-height:76%;object-fit:contain}
.gl i{font-style:normal;font-weight:800;font-size:1.1vw;color:var(--logo-fg)}
.gch b{font-weight:500;font-size:1.1vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtl{position:relative;flex:none}
.gp{position:absolute;top:0;bottom:0;background:var(--panel);border-radius:.5vw;padding:0 .8vw;display:flex;flex-direction:column;justify-content:center;overflow:hidden;font-size:1.25vw}
.gp b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gp small{color:var(--mut);font-size:.95vw;white-space:nowrap}
.gp.now{background:var(--panel2)}
.gp.now::after{content:"";position:absolute;left:0;bottom:0;height:.5vh;width:var(--p,0%);background:var(--red)}
.gnow{position:absolute;top:0;bottom:0;width:.18vw;background:var(--red);z-index:1;pointer-events:none}

/* busca e configurações */
.field{margin:2.4vh 3vw 0;flex-wrap:wrap;display:flex;gap:1.2vw;align-items:center}
input{flex:1;min-width:0;background:var(--panel);border:.15vw solid var(--line);border-radius:.8vw;padding:1.4vh 1.4vw}
input:focus{border-color:var(--ring)}
.pill{padding:1.3vh 2.4vw;border-radius:99px;background:var(--panel2);font-weight:600}
.pill.main{background:var(--red);color:#fff}
#toast{position:fixed;top:3vh;right:3vw;z-index:20;background:var(--txt);color:var(--bg);padding:1vh 1.8vw;border-radius:99px;font-weight:600;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
</style>
</head>
<body>
<video id="v" playsinline muted poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
<div id="bgimg"></div>
<div id="pfade"></div>

<div id="app">
  <nav id="rail">
    <div class="brand">IP<b>TV</b></div>
    <div class="ri">
      <button class="rb" data-f data-v="home" aria-label="Início"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg></button>
      <button class="rb" data-f data-v="search" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg></button>
      <button class="rb" data-f data-v="favs" aria-label="Favoritos"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M10 10.5v5l4.5-2.5z"/><path d="M6 3.5h12"/></svg></button>
    </div>
    <button class="rb" data-f data-v="cfg" aria-label="Configurações"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="3.4 2.8"/></svg></button>
  </nav>
  <div id="content">
    <header id="tabs">
      <button class="tab" data-f data-v="home">Início</button>
      <button class="tab" data-f data-v="live">Ao Vivo</button>
      <button class="tab" data-f data-v="guide">Guia</button>
      <button class="tab" data-f data-v="favs">Favoritos</button>
    </header>
    <div id="main"></div>
  </div>
</div>

<div id="pov">
  <div id="pmsg"></div>
  <div id="pbar" class="off">
    <div class="prow">
      <div class="pl">
        <div class="plogo" id="plogo"></div>
        <div class="pt"><h2 id="pn"></h2><div class="pm"><span class="badge">AO VIVO</span><span id="pg"></span></div><div id="pe" class="pe"></div><div class="pline"><i></i></div><small>Cima/baixo: canal · Esquerda: painel · Direita: rodapé · OK: opções · OK 2x: favoritar</small></div>
      </div>
      <div class="pctl"><button class="pill" data-f id="pplay" data-act="play">Pausar</button><button class="pill" data-f id="pfav" data-act="fav2">Favoritar</button><button class="pill" data-f data-act="menu">Opções</button><button class="pill" data-f data-act="back">Voltar</button></div>
    </div>
    <div id="pmc"></div>
  </div>
  <div id="pmenu">
    <button class="pill" data-f id="mfav" data-act="fav"></button>
    <button class="pill" data-f id="mratio" data-act="ratio"></button>
    <button class="pill" data-f id="mcat" data-act="cat"></button>
    <button class="pill" data-f data-act="close">Continuar assistindo</button>
    <h3>Canais</h3>
    <div id="mlist"></div>
    <button class="pill" data-f data-act="exit">Sair do canal</button>
  </div>
</div>
<div id="toast"></div>
<input type="file" id="file" accept=".m3u,.m3u8,.txt" hidden>

<script>
/* Para já abrir com a sua lista, coloque o endereço entre as aspas abaixo: */
const DEFAULT_LIST='';

const $=s=>document.querySelector(s), main=$('#main'), v=$('#v'), pov=$('#pov');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}},set(k,x){try{localStorage.setItem(k,JSON.stringify(x))}catch(e){}}};

let ch=[], favs=new Set(store.get('tv_favs',[])), recent=store.get('tv_recent',[]);
let view='home', rows=[], ctx=[], cur=-1, loaded=-1, mode='off', hls=null, cat='Recentes', tmr=0, itmr=0, lastFocus=-1;
const HEART='<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.4-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.6-8 11-8 11z"/></svg>';

/* ---------- lista M3U ---------- */
/* ---------- temas, miniaturas, slide e fundo ---------- */
const THEMES={
 dark:{n:'Escuro',bg:'#0b0b0d',panel:'#1b1b20',panel2:'#26262d',txt:'#ffffff',txt2:'#dcdce2',mut:'#a7a7b2',rail:'#0c0c0f',ring:'#ffffff',tabon:'#e9e9ec',tabfg:'#111111',line:'#33333b'},
 navy:{n:'Azul escuro',bg:'#09101f',panel:'#121c33',panel2:'#1b2a4a',txt:'#f2f6ff',txt2:'#cdd8f0',mut:'#93a4c7',rail:'#0a1224',ring:'#ffffff',tabon:'#dce8ff',tabfg:'#0b1730',line:'#2a3a5e'},
 sky:{n:'Azul claro',light:1,bg:'#e8f2ff',panel:'#ffffff',panel2:'#d3e5fb',txt:'#0f2038',txt2:'#2b4467',mut:'#5b7396',rail:'#d7e8fb',ring:'#0f2038',tabon:'#1769e0',tabfg:'#ffffff',line:'#b8cfee'},
 light:{n:'Claro',light:1,bg:'#f4f4f6',panel:'#ffffff',panel2:'#e4e4ea',txt:'#17171c',txt2:'#3a3a44',mut:'#6a6a78',rail:'#e9e9ee',ring:'#17171c',tabon:'#17171c',tabfg:'#ffffff',line:'#cfcfd8'}

function parseM3U(text){
  const out=[];let info=null;
  for(const raw of text.split(/\r?\n/)){
    const l=raw.trim();if(!l)continue;
    if(l.startsWith('#EXTINF')){
      const at=n=>{const m=l.match(new RegExp(n+'="([^"]*)"','i'));return m?m[1]:''};
      info={name:(l.split(/,(.*)$/)[1]||at('tvg-name')||'Sem nome').trim(),logo:at('tvg-logo'),group:at('group-title'),tvid:at('tvg-id')};
    }else if(!l.startsWith('#')){
      if(info){out.push({...info,url:l});info=null}
      else if(/^(https?|rtmp|rtsp):/.test(l))out.push({name:l,logo:'',group:'',url:l});
    }
  }
  return out;
}

  return {cur:a[i],next:a[i+1]||null,pct:Math.max(0,Math.min(100,Math.round((n-a[i].s)/(a[i].e-a[i].s)*100)))};

function xt(s){
  const m=(s||'').match(/^(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)?\s*([+-])?(\d\d)?(\d\d)?/);
  if(!m)return 0;
  let t=Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0));
  if(m[7]){const off=(+m[8]*60+ +(m[9]||0))*60000;t+=m[7]==='+'?-off:off}
  return t;
}
const xattr=(a,n)=>{const m=a.match(new RegExp('\\b'+n+'="([^"]*)"'));return m?m[1]:''};
const unx=s=>s.replace(/<!\[CDATA\[|\]\]>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;|&#39;/g,"'").replace(/&amp;/g,'&');
async function fetchEpg(u){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),90000);
  try{
    const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);
    const buf=new Uint8Array(await r.arrayBuffer());
    if(buf[0]===0x1f&&buf[1]===0x8b){
      if(!window.DecompressionStream)throw new Error('arquivo .gz sem suporte neste aparelho');
      return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    }
    return new TextDecoder('utf-8').decode(buf);
  }finally{clearTimeout(t)}
}
async function parseEpg(xml,want,data,icon){
  const info={};let m,n=0;
  const reC=/<channel\s+([^>]*?)>([\s\S]*?)<\/channel>/g;
  while((m=reC.exec(xml))){
    const xid=xattr(m[1],'id');if(!xid)continue;
    const keys=[xid.toLowerCase()];
    const reN=/<display-name[^>]*>([\s\S]*?)<\/display-name>/g;let mn;
    while((mn=reN.exec(m[2])))keys.push(nrm(unx(mn[1])));
    if(!keys.some(k=>k&&want.has(k)))continue;
    const ic=m[2].match(/<icon\s+[^>]*src="([^"]*)"/);
    info[xid]={keys:keys.filter(Boolean),icon:ic?unx(ic[1]):''};
    if(++n%400===0)await new Promise(r=>setTimeout(r));
  }
  const now=Date.now(),lo=now-30*60000,hi=now+14*3600000,tmp={};
  const reP=/<programme\s+([^>]*?)>([\s\S]*?)<\/programme>/g;let cnt=0,progs=0;
  while((m=reP.exec(xml))){
    const a=m[1],xid=xattr(a,'channel');
    if(info[xid]){
      const s=xt(xattr(a,'start')),e=xt(xattr(a,'stop'));
      if(e>lo&&s<hi){
        const t=m[2].match(/<title[^>]*>([\s\S]*?)<\/title>/),d=m[2].match(/<desc[^>]*>([\s\S]*?)<\/desc>/);
        (tmp[xid]=tmp[xid]||[]).push({s,e,t:t?unx(t[1]).trim():'',d:d?unx(d[1]).trim().slice(0,240):''});
        progs++;
      }
    }
    if(++cnt%3000===0)await new Promise(r=>setTimeout(r));
  }
  for(const xid in tmp){
    const arr=tmp[xid].sort((x,y)=>x.s-y.s).slice(0,16);
    info[xid].keys.forEach(k=>{if(!data[k])data[k]=arr});
  }
  for(const xid in info){const inf=info[xid];if(inf.icon)inf.keys.forEach(k=>{if(!icon[k])icon[k]=inf.icon})}
  return progs;
}
async function loadEpg(){

}

    }).join('');

/* ---------- diagnóstico e escolha do mecanismo ---------- */
const nativeAvail=!!(window.Android&&typeof Android.nPlay!=='undefined');
if(window.Android)document.documentElement.classList.add('droid');
let playerMode=localStorage.getItem('tv_playmode')||'auto';
if(playerMode==='exo'&&!nativeAvail)playerMode='auto';
const MODES=[['auto','Automático'],['exo','ExoPlayer (Media3)'],['hls','HLS.js'],['native','HTML5 nativo']];
const modeLabel=()=>(MODES.find(m=>m[0]===playerMode)||MODES[0])[1];
/* prévia: sempre 16:9, ~46% da altura da tela (nunca mais que 60% da largura) */
function miniSize(){const W=innerWidth,H=innerHeight,hp=H*0.46,wp=Math.min(hp*16/9,W*0.6);return [wp,hp,W,H]}
function miniRect(){const [wp,hp,W,H]=miniSize();return [1-wp/W,0,1,hp/H]}
function layoutMini(){const [wp,hp]=miniSize(),s=document.documentElement.style;s.setProperty('--mw',wp+'px');s.setProperty('--mh',hp+'px')}
layoutMini();addEventListener('resize',()=>{layoutMini();syncVideo()});
let isNative=false,nPaused=false,curEngine='web',chkT=0,stickyMsg=false,tried={};
const engMemo=store.get('tv_engmemo',{});
const diagLog=[];
let lastDiag='Pronto para diagnosticar.';
/* O diagnóstico vai para o registro; só ERROS aparecem sobre o vídeo. */
function diag(t,err=false){
  lastDiag=new Date().toLocaleTimeString()+' — '+t;
  diagLog.push(lastDiag);if(diagLog.length>40)diagLog.shift();
  const m=document.querySelector('#diagmsg');if(m)m.textContent=lastDiag;
  if(err)pm(t,true);
}
function codecName(m){
  const s=(m||'').toLowerCase();
  if(s.includes('hevc')||s.includes('h265'))return 'H.265/HEVC';
  if(s.includes('avc'))return 'H.264';
  if(s.includes('mpeg2'))return 'MPEG-2';
  if(s.includes('eac3'))return 'E-AC-3';
  if(s.includes('ac3'))return 'AC-3';
  if(s.includes('dts'))return 'DTS';
  if(s.includes('mp4a')||s.includes('aac'))return 'AAC';
  return m||'formato desconhecido';
}
function cycleMode(){
  const list=MODES.filter(m=>m[0]!=='exo'||nativeAvail);
  const i=list.findIndex(m=>m[0]===playerMode);
  playerMode=list[(i+1)%list.length][0];
  localStorage.setItem('tv_playmode',playerMode);tried={};loaded=-1;
  const b=document.querySelector('#bplaymode');if(b)b.textContent='Player: '+modeLabel();
  diag('Player alterado para: '+modeLabel());
}
function showDiag(){
  const c=ch[cur]||ch[loaded];
  const lines=[
    'Player: '+modeLabel()+' | em uso: '+(isNative?'ExoPlayer (Media3)':'navegador'),
    'ExoPlayer disponível: '+(nativeAvail?'sim':'não (rodando no navegador)'),
    'Canal: '+(c?clean(c.name)+' ('+hostOf(c.url)+')':'nenhum'),
    'HLS.js: '+(window.Hls?(Hls.version||'carregado'):'não carregado'),
    'Vídeo HTML5: '+(v.error?'erro código '+v.error.code:'sem erro')+(v.videoWidth?' | '+v.videoWidth+'×'+v.videoHeight:''),
    '— últimos eventos —',...diagLog.slice(-10)
  ];
  const b=document.querySelector('#diagbox');if(b)b.textContent=lines.join('\n');
}

/* ---------- player ---------- */
const pm=(t,e)=>{const m=$('#pmsg');m.textContent=t;m.className=e?'err':''};
const setPlayLabel=p=>{const b=$('#pplay');if(b)b.textContent=p?'Reproduzir':'Pausar'};
function pickEngine(c){
  if(playerMode==='exo')return nativeAvail?'exo':'web';
  if(playerMode!=='auto')return 'web';
  if(engMemo[c.url]==='web')return 'web';
  return nativeAvail?'exo':'web';
}
/* Troca de motor (só no modo Automático). Cada canal tenta no máximo um motor alternativo. */
function failover(i,to,why){
  const c=ch[i];if(!c)return;
  tried[c.url]=(tried[c.url]||0)+1;
  if(tried[c.url]>1||(to==='exo'&&!nativeAvail)){
    stickyMsg=true;
    pm('Não foi possível reproduzir este canal ('+why+'). Use cima ou baixo para trocar de canal.',true);
    diag('Nenhum player conseguiu reproduzir: '+why,true);
    return;
  }
  engMemo[c.url]=to==='exo'?'exo':'web';store.set('tv_engmemo',engMemo);
  diag('Trocando para '+(to==='exo'?'ExoPlayer':'player do navegador')+': '+why);
  load(i,to);
}
function stopAll(){
  clearTimeout(chkT);
  if(hls){hls.destroy();hls=null}
  v.pause();v.removeAttribute('src');v.load();
  if(isNative){try{Android.nStop()}catch(e){}isNative=false}
}
function load(i,force){
  if(!ch[i])return;
  const c=ch[i],eng=force||pickEngine(c);
  if(!force&&loaded===i&&(hls||v.getAttribute('src')||isNative))return;
  loaded=i;stickyMsg=false;pm('');stopAll();curEngine=eng;
  diag('Carregando canal: '+clean(c.name)+' ['+(eng==='exo'?'ExoPlayer':'navegador')+']');
  if(eng==='exo'){
    isNative=true;nPaused=false;syncVideo();
    try{Android.nPlay(c.url)}catch(e){isNative=false;diag('Falha ao iniciar o ExoPlayer: '+e.message,true)}
    return;
  }
  loadWeb(c,i);syncVideo();
}
function loadWeb(c,i){
  const isHls=/\.m3u8(?:$|[?#])/i.test(c.url)||/\/live\//i.test(c.url);
  const canHls=window.Hls&&Hls.isSupported();
  const useHls=playerMode==='hls'||(playerMode==='auto'&&isHls&&canHls);
  const giveUp=why=>{
    if(playerMode==='auto'&&nativeAvail&&curEngine==='web')failover(i,'exo',why);
    else{stickyMsg=true;pm('Não foi possível reproduzir este canal ('+why+').',true)}
  };
  if(useHls&&canHls){
    hls=new Hls({lowLatencyMode:false,enableWorker:true,fragLoadingMaxRetry:3,manifestLoadingMaxRetry:2,levelLoadingMaxRetry:3});
    hls.on(Hls.Events.MEDIA_ATTACHED,()=>diag('HLS.js conectado ao vídeo; carregando playlist.'));
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{diag('Playlist HLS interpretada; iniciando reprodução.');playSafe()});
    let rec=0;
    hls.on(Hls.Events.ERROR,(e,d)=>{
      const detail=[d.type,d.details,d.reason].filter(Boolean).join(' / ');
      diag('HLS '+(d.fatal?'fatal':'aviso')+': '+(detail||'sem detalhes'));
      if(!d.fatal)return;
      if(d.type===Hls.ErrorTypes.NETWORK_ERROR&&rec++<2){try{hls.startLoad();return}catch(_){}}
      if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&rec++<2){try{hls.recoverMediaError();return}catch(_){}}
      hls.destroy();hls=null;
      if(playerMode==='auto'){diag('HLS.js falhou; tentando HTML5 nativo.');v.src=c.url;v.play().catch(err=>giveUp('HTML5: '+err.message))}
      else giveUp('HLS.js: '+detail);
    });
    hls.loadSource(c.url);hls.attachMedia(v);
  }else{
    if(playerMode==='hls')diag('HLS.js não é suportado aqui; usando HTML5 nativo.');
    v.src=c.url;v.play().catch(err=>diag('HTML5 não iniciou: '+err.message));
  }
  /* toca mas sem imagem: codec de vídeo sem suporte */

/* ---------- navegação por controle remoto ---------- */
function focusEl(el){if(!el)return;el.focus({preventScroll:true});el.scrollIntoView({block:'nearest',inline:'nearest'})}
function move(dir){
  const cur=document.activeElement;
  const root=mode==='full'?(menuOpen?$('#pmenu'):$('#pbar')):document;
  const els=[...root.querySelectorAll('[data-f],input')].filter(e=>e.offsetParent!==null);
  if(!cur||!els.includes(cur)){focusEl(els.find(e=>main.contains(e))||els[0]);return}
  if(cur.classList.contains('grow')&&dir==='L'){focusEl(document.querySelector('.cat.on'));return}
  if(cur.classList.contains('cat')&&dir==='R'){focusEl(document.querySelector('.grow'));return}
  const c=cur.getBoundingClientRect(),cx=c.left+c.width/2,cy=c.top+c.height/2;
  let best=null,bs=1e9;
  for(const e of els){
    if(e===cur)continue;
    const r=e.getBoundingClientRect(),dx=r.left+r.width/2-cx,dy=r.top+r.height/2-cy;let s;
    const off=Math.abs(dy)<c.height*.5?0:1e4+Math.abs(dy)*3; /* esquerda/direita: prefere a mesma linha */
    if(dir==='R'&&dx>8)s=dx+off;
    else if(dir==='L'&&dx<-8)s=-dx+off;
    else if(dir==='D'&&dy>8)s=dy+Math.abs(dx)*1.5;
    else if(dir==='U'&&dy<-8)s=-dy+Math.abs(dx)*1.5;
    else continue;
    if(s<bs){bs=s;best=e}
  }
  focusEl(best);
}
document.addEventListener('keydown',e=>{
  if(mode==='full'){
    const mk={ArrowRight:'R',ArrowLeft:'L',ArrowDown:'D',ArrowUp:'U'};
    if(menuOpen){
      if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();closeMenu();return}
      if(mk[e.key]){e.preventDefault();move(mk[e.key])}
      return;
    }
    if(footMode){
      if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();exitFoot();return}
      if(mk[e.key]){
        e.preventDefault();
        const a=document.activeElement;
        if(e.key==='ArrowUp'&&a&&a.closest&&a.closest('.pctl')){exitFoot();return}
        move(mk[e.key]);
      }
      return;
    }
    if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();closeFull();return}
    if(e.key==='ArrowUp'||e.key==='ChannelUp'||e.key==='PageUp'){e.preventDefault();zap(-1)}
    else if(e.key==='ArrowDown'||e.key==='ChannelDown'||e.key==='PageDown'){e.preventDefault();zap(1)}
    else if(e.key==='ArrowLeft'){e.preventDefault();openMenu()}
    else if(e.key==='ArrowRight'){e.preventDefault();enterFoot()}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();twoClick('ok',openMenu,()=>{toggleFav(cur);showInfo(cur)})}
    else if(e.key==='ContextMenu'){e.preventDefault();openMenu()}
    else showInfo(cur);
    return;
  }
  const typing=document.activeElement&&document.activeElement.tagName==='INPUT';
  const map={ArrowRight:'R',ArrowLeft:'L',ArrowDown:'D',ArrowUp:'U'};
  if(map[e.key]){
    if(typing&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))return;
    e.preventDefault();move(map[e.key]);return;
  }
  if(e.key==='Escape'||(e.key==='Backspace'&&!typing)){e.preventDefault();onBack()}
});

const bmsg=(t,e)=>{const m=$('#bmsg');if(m){m.textContent=t;m.style.color=e?'#ff8a8f':'var(--mut)'}};
function makeBackup(){
  const ls={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.startsWith('tv_')&&!k.startsWith('tv_src_')&&k!=='tv_epgcache')ls[k]=localStorage.getItem(k);
  }
  const lists={};
  sources.forEach(s=>{if(!s.url){const t=cacheGet(s.id);if(t)lists[s.id]=t}});
  return JSON.stringify({iptvBackup:1,date:new Date().toISOString(),ua:getUA(),ls,lists});
}
function doBackup(){
  const name='iptv-backup-'+new Date().toISOString().slice(0,10)+'.json',text=makeBackup();
  if(window.Android&&typeof Android.saveBackup!=='undefined'){Android.saveBackup(name,text);bmsg('Escolha onde salvar o arquivo…');return}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  bmsg('Backup salvo: '+name);
}
function restoreBackup(text){
  let b;try{b=JSON.parse(text)}catch(e){return false}
  if(!b||!b.iptvBackup)return false;
  Object.keys(b.ls||{}).forEach(k=>{try{localStorage.setItem(k,b.ls[k])}catch(e){}});
  Object.keys(b.lists||{}).forEach(id=>cacheSet(id,b.lists[id]));
  try{if(typeof b.ua==='string'&&window.Android&&typeof Android.setUserAgent!=='undefined')Android.setUserAgent(b.ua)}catch(e){}
  return true;
}
function handlePicked(name,text){

    else bmsg('Arquivo de backup inválido.',true);
    return;
  }
  addLocal(name,text);
}

$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  handlePicked(f.name,await f.text());e.target.value='';
});

/* toque (celular): toque simples mostra/esconde os controles, duplo toque favorita, deslizar troca de canal */
pov.addEventListener('click',e=>{
  if(e.target!==pov)return;
  twoClick('tap',()=>{
    if(menuOpen){closeMenu();return}
    if(footMode){exitFoot();return}
    const b=$('#pbar');if(b.classList.contains('off'))showInfo(cur);else b.classList.add('off');
  },()=>{toggleFav(cur);showInfo(cur)});
});
let ty0=0;
pov.addEventListener('touchstart',e=>{ty0=e.touches[0].clientY},{passive:true});
pov.addEventListener('touchend',e=>{
  if(e.target.closest&&e.target.closest('#pbar,#pmenu'))return;
  const dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dy)>90&&!menuOpen&&!footMode)zap(dy<0?1:-1);
},{passive:true});
applyLogo();applyUI();setInterval(slideTick,1000);
(async()=>{
  /* migra a lista única da versão anterior */
  if(!sources.length){
    const oldUrl=store.get('tv_url',''),oldList=store.get('tv_list','');
    if(oldUrl||oldList){const id=uid();sources.push({id,name:'Minha lista',url:oldUrl,on:true});if(oldList)cacheSet(id,oldList)}
  }
  const q=new URLSearchParams(location.search).get('lista');
  if(q&&!sources.some(s=>s.url===q))sources.push({id:uid(),name:hostOf(q),url:q,on:true});
  if(!sources.length&&DEFAULT_LIST)sources.push({id:uid(),name:hostOf(DEFAULT_LIST),url:DEFAULT_LIST,on:true});
  if(sources.length){
    main.innerHTML='<div class="empty">Carregando listas…</div>';
    await Promise.all(sources.filter(s=>s.on).map(loadSource));
    saveSources();rebuild();
  }
  render();
  focusEl(main.querySelector('[data-i],[data-f]')||document.querySelector('.rb'));
  if(epgSources.some(s=>s.on)&&(!epgAt||Date.now()-epgAt>6*3600e3))loadEpg().then(()=>{if(view==='cfg')renderCfg()});
})();
</script>
