<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player IPTV</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>

  #pmsg {
    display: none !important;
}
:root{--logo-bg:#17171c;--logo-fg:#cfd3dd;--logo-sh:none;--bg:#0b0b0d;--panel:#1b1b20;--panel2:#26262d;--txt:#fff;--mut:#a7a7b2;--red:#e5262d}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--txt);font:1.5vw/1.35 Poppins,Montserrat,Roboto,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;text-align:left;cursor:pointer}
button:focus,input:focus{outline:none}
[data-f]{transition:transform .12s,box-shadow .12s,background .12s}
[data-f]:focus{box-shadow:0 0 0 .22vw #fff;transform:scale(1.03);position:relative;z-index:3}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#app{position:relative;z-index:1;display:flex;height:100%}
#rail{width:6.2vw;flex:none;background:#0c0c0f;display:flex;flex-direction:column;align-items:center;padding:3.2vh 0}
.brand{font-weight:800;font-size:1.15vw;letter-spacing:.08em;color:#fff}
.brand b{color:var(--red)}
.ri{flex:1;display:flex;flex-direction:column;gap:3.4vh;align-items:center;margin-top:7vh}
.rb{position:relative;width:4vw;height:4vw;display:grid;place-items:center;border-radius:1vw;color:var(--mut)}
.rb svg{width:2.1vw;height:2.1vw}
.rb.on{color:#fff}
.rb.on::after{content:"";position:absolute;bottom:.2vw;width:1vw;height:.18vw;background:var(--red);border-radius:2px}
.rb:focus{background:#fff;color:#000}

#content{flex:1;min-width:0;display:flex;flex-direction:column}
#tabs{display:flex;gap:.6vw;padding:2.6vh 3vw 0;height:11vh;align-items:flex-start}
.tab{font-size:2vw;font-weight:600;padding:.4vw 1.6vw;border-radius:99px;color:#fff}
.tab.on{background:#e9e9ec;color:#111}
#main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
#main::-webkit-scrollbar{display:none}
#main.live{overflow:hidden}

/* início */
.hero{position:relative;height:49vh;padding:3vh 3vw 0;display:flex;justify-content:space-between;gap:3vw;
  background:radial-gradient(ellipse at 78% 25%,#3b1217 0,transparent 62%)}
.hx{max-width:56vw}
.hm{font-size:1.5vw;font-weight:600;color:#ddd;display:flex;align-items:center;gap:.8vw}
.badge{background:var(--red);color:#fff;font-size:1vw;font-weight:700;padding:.1vw .6vw;border-radius:.3vw;letter-spacing:.04em}
.hero h1{font-size:4.6vw;line-height:1.08;margin:1.4vh 0;font-weight:800;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero p{margin:0;font-size:1.45vw;color:#d4d4da}
.hl{flex:none;width:25vw;aspect-ratio:16/9;margin-top:1vh;background:var(--logo-bg);border-radius:1vw;display:grid;place-items:center;overflow:hidden;box-shadow:var(--logo-sh)}
.hl img{width:74%;height:74%;object-fit:contain}
.hl i,.th i,.glogo i,.plogo i{font-style:normal;font-weight:800;color:var(--logo-fg)}
.hl i{font-size:4vw}
.row h2{font-size:1.7vw;margin:1.4vh 3vw 0;font-weight:700}
.strip{display:flex;gap:1.2vw;overflow-x:auto;padding:1.6vh 3vw 2.6vh}
.strip::-webkit-scrollbar{display:none}
.card{flex:none;width:17vw;border-radius:.8vw;position:relative}
.th{display:grid;place-items:center;aspect-ratio:16/9;background:var(--logo-bg);border-radius:.8vw;overflow:hidden}
.th img{width:76%;height:76%;object-fit:contain}
.th i{font-size:2.2vw}
.card b{display:block;margin-top:.8vh;font-weight:500;font-size:1.2vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.fav::after{content:"";position:absolute;top:.6vw;right:.6vw;width:1.5vw;height:1.5vw;background:var(--red);border-radius:50%;box-shadow:0 0 0 .2vw #fff}
.grid{display:flex;flex-wrap:wrap;gap:1.6vw 1.2vw;padding:2vh 3vw}
.srow{margin:1.2vh 3vw 0;display:flex;gap:1vw;align-items:center}
.sn{flex:1;min-width:0;font-size:1.5vw;font-weight:600}
.sn small{display:block;color:var(--mut);font-size:1.1vw;font-weight:400}
.sec{margin:3.4vh 3vw 0;font-size:1.7vw;font-weight:700}
.title{font-size:2.6vw;font-weight:800;margin:1vh 3vw 0}
.sub{margin:.4vh 3vw 0;color:var(--mut)}
.empty{margin:3vh 3vw;color:var(--mut);font-size:1.5vw}

/* ao vivo */
.live{position:relative;height:100%}
.lhead{position:absolute;left:3vw;top:1vh;width:42vw}
.lm{font-size:1.4vw;font-weight:600;color:#ddd;display:flex;align-items:center;gap:.8vw}
.lhead h1{font-size:3.2vw;line-height:1.1;font-weight:800;margin:.6vh 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lhead p{margin:0;font-size:1.35vw;color:#cfcfd6}
.lbody{position:absolute;left:0;right:0;top:36vh;bottom:0;display:flex;gap:1.4vw;padding:0 2vw 0 2.4vw}
.cats{width:19vw;flex:none;overflow-y:auto;padding:.6vh .5vw}
.cats::-webkit-scrollbar,.guide::-webkit-scrollbar{display:none}
.cat{display:block;width:100%;padding:1.1vh 1.1vw;border-radius:.7vw;margin-bottom:.8vh;color:#b9b9c2;font-size:1.45vw;font-weight:600}
.cat small{display:block;font-size:1vw;font-weight:400;color:var(--mut)}
.cat.on{background:var(--panel);color:#fff}
.guide{flex:1;overflow-y:auto;padding:.6vh .5vw}
.grow{display:flex;gap:.7vw;width:100%;height:8.2vh;margin-bottom:1vh;border-radius:.5vw}
.glogo{width:9vw;flex:none;background:var(--logo-bg);border-radius:.5vw;display:grid;place-items:center;overflow:hidden}
.glogo img{max-width:72%;max-height:72%;object-fit:contain}
.glogo i{font-size:1.6vw;color:#ccd}
.gbar{flex:1;min-width:0;background:var(--panel);border-radius:.5vw;display:flex;align-items:center;gap:1.4vw;padding:0 1.4vw;position:relative;overflow:hidden}
.gbar b{font-weight:500;font-size:1.45vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar small{color:var(--mut);font-size:1.1vw;white-space:nowrap;margin-left:auto}
.gbar::after{content:"";position:absolute;left:0;bottom:0;height:.5vh;width:var(--p,40%);background:var(--red)}
.grow:focus .gbar,.grow:focus .glogo{background:var(--panel2)}

/* vídeo */
#v{display:none;background:#000}
#v.mini{display:block;position:fixed;z-index:0;top:0;right:0;width:56vw;height:36vh;object-fit:cover;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 28%);mask-image:linear-gradient(90deg,transparent 0,#000 28%)}
#v.full{display:block;position:fixed;z-index:8;inset:0;width:100%;height:100%;object-fit:contain}
#pov{position:fixed;inset:0;z-index:9;display:none}
#pov.on{display:block}
#pmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:4vw;font-size:1.8vw;pointer-events:none;display:none !important}
#pmsg.err{color:#ff8a8f}
#pbar{position:absolute;left:0;right:0;bottom:0;padding:8vh 4vw 3.5vh;background:linear-gradient(0deg,#000f 35%,transparent);display:flex;flex-direction:column;gap:1vh;transition:opacity .4s}
#pbar.off{opacity:0}
.pl{flex:1;min-width:0;display:flex;gap:1.6vw;align-items:center}
.plogo{width:11vw;aspect-ratio:16/9;flex:none;background:var(--logo-bg);border-radius:.6vw;display:grid;place-items:center;overflow:hidden}
.plogo img{width:76%;height:76%;object-fit:contain}
.pt{flex:1;min-width:0}
.pt h2{margin:0;font-size:2.6vw;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt .pm{display:flex;align-items:center;gap:.8vw;font-size:1.4vw}
.pline{height:.5vh;background:#ffffff40;border-radius:9px;margin:1.2vh 0;overflow:hidden}
.pline i{display:block;height:100%;width:60%;background:var(--red)}
.pt small{color:#d0d0d6;font-size:1.15vw}
.heart{width:3vw;height:3vw;flex:none;color:#fff}
.heart svg{width:100%;height:100%}
.heart.on svg{fill:var(--red);stroke:var(--red)}
#pmc{display:flex;gap:.8vw;overflow-x:auto;position:relative;padding:1vh .5vw .6vh}
#pmc::-webkit-scrollbar{display:none}
.pc{flex:none;width:11vw;border-radius:.6vw}
.pc .ml{width:100%}
.pc b{display:block;margin-top:.4vh;font-weight:500;font-size:1.1vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc.cur .ml{outline:.22vw solid var(--red)}
.pctl{display:flex;gap:1vw;flex:none}
.pctl .pill{font-size:1.4vw}
.prow{display:flex;justify-content:space-between;align-items:flex-end;gap:3vw}
.grow.fav .glogo::after{content:"";position:absolute;top:.4vw;right:.4vw;width:1vw;height:1vw;background:var(--red);border-radius:50%}
.glogo{position:relative}

#pmenu{position:absolute;left:0;top:0;bottom:0;width:34vw;display:none;flex-direction:column;gap:1.4vh;padding:4vh 2vw;background:linear-gradient(90deg,#000f 55%,#000a 80%,transparent);z-index:3}
#pmenu.on{display:flex}
#pmenu h3{margin:1vh 0 0;font-size:1.5vw;color:var(--mut);font-weight:600}
#pmenu .pill{display:block;width:26vw;font-size:1.4vw}
#mlist{flex:1;overflow-y:auto;min-height:0;padding:.4vh .3vw}
#mlist::-webkit-scrollbar{display:none}
.mi{display:flex;align-items:center;gap:1vw;width:26vw;padding:.8vh .8vw;border-radius:.6vw;margin-bottom:.6vh;background:#ffffff12}
.mi.cur{background:#ffffff30}
.mi b{font-weight:500;font-size:1.35vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml{width:5.5vw;aspect-ratio:16/9;flex:none;background:var(--logo-bg);border-radius:.4vw;display:grid;place-items:center;overflow:hidden}
.ml img{width:76%;height:76%;object-fit:contain}
.ml i{font-style:normal;font-weight:800;color:var(--logo-fg);font-size:1.1vw}

/* busca e configurações */
.field{margin:2.4vh 3vw 0;display:flex;gap:1.2vw;align-items:center}
input{flex:1;min-width:0;background:var(--panel);border:.15vw solid #33333b;border-radius:.8vw;padding:1.4vh 1.4vw}
input:focus{border-color:#fff}
.pill{padding:1.3vh 2.4vw;border-radius:99px;background:var(--panel2);font-weight:600}
.pill.main{background:#fff;color:#111}
#toast{position:fixed;top:3vh;right:3vw;z-index:20;background:#fff;color:#111;padding:1vh 1.8vw;border-radius:99px;font-weight:600;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
</style>
</head>
<body>
<video id="v" playsinline muted poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>

<div id="app">
  <nav id="rail">
    <div class="brand">IP<b>TV</b></div>
    <div class="ri">
      <button class="rb" data-f data-v="home" aria-label="Início"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg></button>
      <button class="rb" data-f data-v="search" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg></button>
      <button class="rb" data-f data-v="favs" aria-label="Favoritos"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M10 10.5v5l4.5-2.5z"/><path d="M6 3.5h12"/></svg></button>
    </div>
    <button class="rb" data-f data-v="cfg" aria-label="Configurações"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="3.4 2.8"/></svg></button>
  </nav>
  <div id="content">
    <header id="tabs">
      <button class="tab" data-f data-v="home">Início</button>
      <button class="tab" data-f data-v="live">Ao Vivo</button>
      <button class="tab" data-f data-v="favs">Favoritos</button>
    </header>
    <div id="main"></div>
  </div>
</div>

<div id="pov">
  <div id="pmsg"></div>
  <div id="pbar" class="off">
    <div class="prow">
      <div class="pl">
        <div class="plogo" id="plogo"></div>
        <div class="pt"><h2 id="pn"></h2><div class="pm"><span class="badge">AO VIVO</span><span id="pg"></span></div><div class="pline"><i></i></div><small>Cima/baixo: trocar canal · Esquerda/direita: rodapé · OK: opções · OK duas vezes: favoritar</small></div>
      </div>
      <div class="pctl"><button class="pill" data-f id="pplay" data-act="play">Pausar</button><button class="pill" data-f id="pfav" data-act="fav2">Favoritar</button></div>
    </div>
    <div id="pmc"></div>
  </div>
  <div id="pmenu">
    <button class="pill" data-f id="mfav" data-act="fav"></button>
    <button class="pill" data-f id="mratio" data-act="ratio"></button>
    <button class="pill" data-f id="mcat" data-act="cat"></button>
    <button class="pill" data-f data-act="close">Continuar assistindo</button>
    <h3>Canais</h3>
    <div id="mlist"></div>
    <button class="pill" data-f data-act="exit">Sair do canal</button>
  </div>
</div>
<div id="toast"></div>
<input type="file" id="file" accept=".m3u,.m3u8,.txt" hidden>

<script>
/* Para já abrir com a sua lista, coloque o endereço entre as aspas abaixo: */
const DEFAULT_LIST='';

const $=s=>document.querySelector(s), main=$('#main'), v=$('#v'), pov=$('#pov');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}},set(k,x){try{localStorage.setItem(k,JSON.stringify(x))}catch(e){}}};

let ch=[], favs=new Set(store.get('tv_favs',[])), recent=store.get('tv_recent',[]);
let view='home', rows=[], ctx=[], cur=-1, loaded=-1, mode='off', hls=null, cat='Recentes', tmr=0, itmr=0, lastFocus=-1;
const HEART='<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.4-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.6-8 11-8 11z"/></svg>';

/* ---------- lista M3U ---------- */
function parseM3U(text){
  const out=[];let info=null;
  for(const raw of text.split(/\r?\n/)){
    const l=raw.trim();if(!l)continue;
    if(l.startsWith('#EXTINF')){
      const at=n=>{const m=l.match(new RegExp(n+'="([^"]*)"','i'));return m?m[1]:''};
      info={name:(l.split(/,(.*)$/)[1]||at('tvg-name')||'Sem nome').trim(),logo:at('tvg-logo'),group:at('group-title')};
    }else if(!l.startsWith('#')){
      if(info){out.push({...info,url:l});info=null}
      else if(/^(https?|rtmp|rtsp):/.test(l))out.push({name:l,logo:'',group:'',url:l});
    }
  }
  return out;
}
/* ---------- várias listas (fontes) ---------- */
let sources=store.get('tv_sources',[]);
const parsed={};
const catmap=store.get('tv_catmap',{});
const uid=()=>Math.random().toString(36).slice(2,9);
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return 'Lista'}};
const cacheGet=id=>{try{return localStorage.getItem('tv_src_'+id)}catch(e){return null}};
const cacheSet=(id,t)=>{try{localStorage.setItem('tv_src_'+id,t)}catch(e){}};
const saveSources=()=>store.set('tv_sources',sources.map(({id,name,url,on})=>({id,name,url,on})));
async function fetchText(u){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);
  try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw 0;return await r.text()}finally{clearTimeout(t)}
}
async function loadSource(s){
  let text=null;
  if(s.url){try{text=await fetchText(s.url);cacheSet(s.id,text)}catch(e){text=cacheGet(s.id)}}
  else text=cacheGet(s.id);
  const arr=text?parseM3U(text):[];
  arr.forEach(c=>{c.src=s.name});
  parsed[s.id]=arr;s.count=arr.length;
  return arr.length;
}

/* categorias automáticas pelo nome do canal (edite as palavras à vontade) */
const ORDEM=['Notícias','Economia','Esportes','Religião','Agro','Filmes e Séries','Infantil','Música','Documentários','Variedades','Outros'];
const REGRAS=[
 ['Agro',/\b(rural|terraviva|terra viva|agro\w*|pecuaria|boi|campo|rancho|agricultura|fazenda|nossa terra)\b/],
 ['Religião',/\b(rede vida|aparecida|cancao nova|gospel|evangel\w*|catolic\w*|igreja|novo tempo|shalom|pai eterno|padre|deus|crist\w*|biblia|boas novas|rit|a12|louvor|adorac\w*|rede super|ewtn|jesus|santo|nossa senhora|missao|tv melodia)\b/],
 ['Esportes',/\b(sport\w*|esporte\w*|espn\w*|premiere|combate|caze\w*|bandsports|dazn|nba|futebol|ufc|eleven|golf|tenis|tennis|racing|motor\w*|fight\w*|olimp\w*|paulistao|copa|liga|libertadores|nfl|mlb|fifa|bein|wwe|lutas|automobilismo|formula|corrida|hipismo|surf|canal off|rodeio|pesca)\b/],
 ['Economia',/\b(bloomberg|money|financ\w*|superfinan\w*|business|economia|cnbc|infomoney|investiment\w*|bolsa|mercado|forex|bitcoin|cripto\w*|negocios|empreend\w*)\b/],
 ['Notícias',/\b(news|noticia\w*|jornal|cnn|globonews|jovem pan|jp|metropoles|cbs|bbc|jazeera|france 24|euronews|dw|tv brasil|agencia|uol|telesur|cgtn|reuters|nhk|tv senado|tv camara|tv justica|assembleia|senado|camara|congresso|poder360|brasil 247)\b/],
 ['Infantil',/\b(kids|infantil|cartoon\w*|disney|nick\w*|gloob\w*|zoo moo|turma da monica|peppa|baby\w*|toon\w*|junior|boomerang|bita|galinha pintadinha|masha|pocoyo|paw patrol|cocomelon|desenho\w*|animacao|anime\w*|crunchyroll|dragon ball|naruto)\b/],
 ['Música',/\b(music\w*|musica\w*|mtv|multishow|trace|vevo|radio\w*|fm|sertanej\w*|pagode|funk|rock|hits|som livre|clip\w*|karaoke|samba|forro)\b/],
 ['Filmes e Séries',/\b(filme\w*|movie\w*|cine\w*|telecine|hbo|amc|sony|axn|warner|tnt|paramount|csi|walking dead|serie\w*|film\w*|cinema|megapix|studio universal|tcm|fx|lifetime|drama\w*|novela\w*|dorama\w*|malhacao|thriller|terror|western|star channel|space|netflix|friends|simpsons|mgm|hallmark|canal brasil|cinemax|filmbox|emocoes)\b/],
 ['Documentários',/\b(discovery|history|historia|national geographic|nat geo|natgeo|animal planet|doc\w*|viajar|travel|natureza|ciencia|science|planet\w*|tlc|investigation|curiosidade\w*|wild|nature|cultura|educa\w*|futura|saber)\b/],
 ['Variedades',/\b(sbt|record|band|redetv|rede tv|globo|gazeta|lifestyle|humor|comedia|variedade\w*|entretenimento|reality|masterchef|culinaria|cozinha|receita\w*|food|gastro\w*|moda|fashion|saude|decoracao|turismo)\b/]
];
function classify(n){
  const s=n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  for(const [k,re] of REGRAS)if(re.test(s))return k;
  return 'Outros';
}
function rebuild(){
  const seen=new Set();ch=[];
  sources.forEach(s=>{if(!s.on)return;(parsed[s.id]||[]).forEach(c=>{if(!seen.has(c.url)){seen.add(c.url);ch.push(c)}})});
  ch.forEach(c=>{c.cat=catmap[c.url]||(c.group||'').trim()||classify(c.name)});
  cur=-1;loaded=-1;
}
const byUrl=u=>ch.findIndex(c=>c.url===u);
const clean=n=>n.replace(/^\d+\s*/,'');
const initials=n=>(clean(n).match(/[A-Za-zÀ-ú0-9]/g)||['?']).slice(0,2).join('').toUpperCase();
const logoHTML=c=>c.logo?`<img src="${esc(c.logo)}" alt="" onerror="this.replaceWith(document.createTextNode('${initials(c.name)}'))">`:`<i>${initials(c.name)}</i>`;
const prog=i=>20+((i*37)%61);

function cats(){
  const rec=recent.map(byUrl).filter(i=>i>=0), fv=[...favs].map(byUrl).filter(i=>i>=0);
  const out=[];
  if(rec.length)out.push({k:'Recentes',idx:rec});
  out.push({k:'Favoritos',idx:fv});
  const m=new Map();
  ch.forEach((c,i)=>{if(!m.has(c.cat))m.set(c.cat,[]);m.get(c.cat).push(i)});

const pm=(t,e)=>{const m=$('#pmsg');m.textContent=t;m.className=e?'err':''};
function load(i){
  if(!ch[i])return;
  if(loaded===i&&(hls||v.getAttribute('src')))return;
  loaded=i;const c=ch[i];
  if(hls){hls.destroy();hls=null}
  v.pause();v.removeAttribute('src');v.load();
  diag('Carregando canal: '+clean(c.name));
  const isHls=/\.m3u8(?:$|[?#])/i.test(c.url)||/\/live\//i.test(c.url);
  const useHls=playerMode==='hls'||(playerMode==='auto'&&isHls&&window.Hls&&Hls.isSupported());
  if(useHls&&window.Hls&&Hls.isSupported()){
    hls=new Hls({lowLatencyMode:false,enableWorker:true,fragLoadingMaxRetry:3,manifestLoadingMaxRetry:2,levelLoadingMaxRetry:3});
    hls.on(Hls.Events.MEDIA_ATTACHED,()=>diag('HLS.js conectado ao vídeo; carregando playlist.'));
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{diag('Playlist HLS interpretada; iniciando reprodução.');v.play().catch(e=>diag('Reprodução bloqueada pelo navegador: '+e.message,true));});
    hls.on(Hls.Events.ERROR,(e,d)=>{
      const detail=[d.type,d.details,d.reason].filter(Boolean).join(' / ');
      diag('HLS '+(d.fatal?'fatal':'recuperável')+': '+(detail||'erro sem detalhes'),!!d.fatal);
      if(!d.fatal){
        if(d.details===Hls.ErrorDetails?.FRAG_PARSING_ERROR){
          diag('fragParsingError: segmento não pôde ser interpretado. Tentando recuperação única.',true);
          try{hls.recoverMediaError()}catch(_){}
        }
        return;
      }
      if(d.type===Hls.ErrorTypes.NETWORK_ERROR){diag('Erro de rede HLS. Tentando reiniciar o carregamento.',true);try{hls.startLoad();return}catch(_){}}
      if(d.type===Hls.ErrorTypes.MEDIA_ERROR){diag('Erro de mídia/codec. Tentando recuperar decodificação.',true);try{hls.recoverMediaError();return}catch(_){}}
      hls.destroy();hls=null;
      if(playerMode!=='hls'){diag('HLS indisponível; tentando vídeo HTML5 nativo.');v.src=c.url;v.play().catch(err=>diag('HTML5 também falhou: '+err.message,true));}
      else diag('HLS.js falhou. Troque o modo para Automático ou HTML5 nativo.',true);
    });
    hls.loadSource(c.url);hls.attachMedia(v);
  }else{
    if(playerMode==='hls'&&(!window.Hls||!Hls.isSupported()))diag('HLS.js não é suportado neste navegador. Tentando HTML5 nativo.',true);
    v.src=c.url;v.play().catch(err=>diag('HTML5 não iniciou: '+err.message+' (pode ser formato, CORS ou política de autoplay)',true));
  }
}

/* ---------- navegação por controle remoto ---------- */
function focusEl(el){if(!el)return;el.focus({preventScroll:true});el.scrollIntoView({block:'nearest',inline:'nearest'})}
function move(dir){
  const cur=document.activeElement;
  const root=mode==='full'?(menuOpen?$('#pmenu'):$('#pbar')):document;
  const els=[...root.querySelectorAll('[data-f],input')].filter(e=>e.offsetParent!==null);
  if(!cur||!els.includes(cur)){focusEl(els.find(e=>main.contains(e))||els[0]);return}
  if(cur.classList.contains('grow')&&dir==='L'){focusEl(document.querySelector('.cat.on'));return}
  if(cur.classList.contains('cat')&&dir==='R'){focusEl(document.querySelector('.grow'));return}
  const c=cur.getBoundingClientRect(),cx=c.left+c.width/2,cy=c.top+c.height/2;
  let best=null,bs=1e9;
  for(const e of els){
    if(e===cur)continue;
    const r=e.getBoundingClientRect(),dx=r.left+r.width/2-cx,dy=r.top+r.height/2-cy;let s;
    if(dir==='R'&&dx>8)s=dx+Math.abs(dy)*3;
    else if(dir==='L'&&dx<-8)s=-dx+Math.abs(dy)*3;
    else if(dir==='D'&&dy>8)s=dy+Math.abs(dx)*1.5;
    else if(dir==='U'&&dy<-8)s=-dy+Math.abs(dx)*1.5;
    else continue;
    if(s<bs){bs=s;best=e}
  }
  focusEl(best);
}
document.addEventListener('keydown',e=>{
  if(mode==='full'){
    const mk={ArrowRight:'R',ArrowLeft:'L',ArrowDown:'D',ArrowUp:'U'};
    if(menuOpen){
      if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();closeMenu();return}
      if(mk[e.key]){e.preventDefault();move(mk[e.key])}
      return;
    }
    if(footMode){
      if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();exitFoot();return}
      if(mk[e.key]){
        e.preventDefault();
        const a=document.activeElement;
        if(e.key==='ArrowUp'&&a&&a.closest&&a.closest('.pctl')){exitFoot();return}
        move(mk[e.key]);
      }
      return;
    }
    if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();closeFull();return}
    if(e.key==='ArrowUp'||e.key==='ChannelUp'||e.key==='PageUp'){e.preventDefault();zap(-1)}
    else if(e.key==='ArrowDown'||e.key==='ChannelDown'||e.key==='PageDown'){e.preventDefault();zap(1)}
    else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();enterFoot()}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();twoClick('ok',openMenu,()=>{toggleFav(cur);showInfo(cur)})}
    else if(e.key==='ContextMenu'){e.preventDefault();openMenu()}
    else showInfo(cur);
    return;
  }
  const typing=document.activeElement&&document.activeElement.tagName==='INPUT';
  const map={ArrowRight:'R',ArrowLeft:'L',ArrowDown:'D',ArrowUp:'U'};
  if(map[e.key]){
    if(typing&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))return;
    e.preventDefault();move(map[e.key]);return;
  }
  if(e.key==='Escape'||(e.key==='Backspace'&&!typing)){e.preventDefault();onBack()}
});

      cat=t.dataset.cat;document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('on',b===t));fillGuide();
    }else if(t.dataset.i!==undefined)previewSoon(+t.dataset.i);
  }else if(view==='home'&&t.dataset.i!==undefined)heroSet(+t.dataset.i);
});

/* ---------- ações ---------- */
function go(name){
  clearTimeout(tmr);
  if(mode!=='off')setMode('off');
  view=name;render();
  focusEl(main.querySelector('.grow,[data-i],input,[data-f]')||document.querySelector('.rb'));
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.mi!==undefined){const i=+t.dataset.mi;cur=i;lastFocus=i;load(i);remember(i);closeMenu();return}
  if(t.dataset.pc!==undefined){const i=+t.dataset.pc;cur=i;lastFocus=i;load(i);remember(i);showInfo(i);return}
  if(t.dataset.act){
    const a=t.dataset.act;
    if(a==='play'){if(v.paused)v.play().catch(()=>{});else v.pause();return}
    if(a==='fav2'){toggleFav(cur);showInfo(cur);return}
    if(a==='fav'){toggleFav(cur);menuLabels()}
    else if(a==='ratio'){ri=(ri+1)%RATIOS.length;v.style.objectFit=RATIOS[ri][1];menuLabels()}
    else if(a==='cat'){
      const k=ORDEM[(ORDEM.indexOf(ch[cur].cat)+1)%ORDEM.length];
      catmap[ch[cur].url]=k;store.set('tv_catmap',catmap);ch[cur].cat=k;menuLabels();toast('Movido para '+k);
    }
    else if(a==='close')closeMenu();
    else if(a==='exit'){closeMenu();closeFull()}
    return;
  }
  if(t.dataset.v){go(t.dataset.v);return}
  if(t.dataset.cat!==undefined){focusEl(document.querySelector('.grow'));return}
  if(t.dataset.i!==undefined){
    const i=+t.dataset.i,r=t.dataset.r;
    twoClick('i'+i,()=>{if(r!==undefined)ctx=rows[+r]||[i];openFull(i)},()=>toggleFav(i));return;
  }
  if(t.id==='badd'){addSource($('#sname').value.trim(),$('#url').value.trim());return}
  if(t.id==='bfile'){$('#file').click();return}
  if(t.id==='breload'){reloadAll();return}
  if(t.dataset.sen){
    const s=sources.find(x=>x.id===t.dataset.sen);s.on=!s.on;saveSources();rebuild();renderCfg();
    focusEl(main.querySelector(`[data-sen="${s.id}"]`));return;
  }
  if(t.dataset.sdel){
    const id=t.dataset.sdel;sources=sources.filter(x=>x.id!==id);delete parsed[id];
    try{localStorage.removeItem('tv_src_'+id)}catch(e){}
    saveSources();rebuild();renderCfg();focusEl(main.querySelector('[data-f]'));return;
  }
  if(t.dataset.ua!==undefined){$('#ua').value=t.dataset.ua;saveUA(t.dataset.ua);return}
  if(t.id==='bua'){saveUA($('#ua').value);return}
  if(t.id==='blogo'){store.set('tv_logo',(store.get('tv_logo',0)+1)%LOGOS.length);applyLogo();t.textContent='Fundo das logos: '+LOGOS[store.get('tv_logo',0)][0];return}
  if(t.id==='bcat'){const cs=cats();sCat=sCat+1>=cs.length?-1:sCat+1;t.textContent='Categoria: '+(sCat<0?'Todas':cs[sCat].k);doSearch();return}
});

/* ---------- início ---------- */
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  const text=await f.text(),arr=parseM3U(text);
  if(!arr.length){lmsg('Nenhum canal encontrado nesse arquivo.',1);return}
  const s={id:uid(),name:f.name.replace(/\.[^.]+$/,''),url:'',on:true};
  cacheSet(s.id,text);arr.forEach(c=>{c.src=s.name});parsed[s.id]=arr;s.count=arr.length;
  sources.push(s);saveSources();rebuild();renderCfg();
  lmsg(`${arr.length} canais adicionados de “${s.name}”.`);e.target.value='';
});
applyLogo();
(async()=>{
  /* migra a lista única da versão anterior */
  if(!sources.length){
    const oldUrl=store.get('tv_url',''),oldList=store.get('tv_list','');
    if(oldUrl||oldList){const id=uid();sources.push({id,name:'Minha lista',url:oldUrl,on:true});if(oldList)cacheSet(id,oldList)}
  }
  const q=new URLSearchParams(location.search).get('lista');
  if(q&&!sources.some(s=>s.url===q))sources.push({id:uid(),name:hostOf(q),url:q,on:true});
  if(!sources.length&&DEFAULT_LIST)sources.push({id:uid(),name:hostOf(DEFAULT_LIST),url:DEFAULT_LIST,on:true});
  if(sources.length){
    main.innerHTML='<div class="empty">Carregando listas…</div>';
    await Promise.all(sources.filter(s=>s.on).map(loadSource));
    saveSources();rebuild();
  }
  render();
  focusEl(main.querySelector('[data-i],[data-f]')||document.querySelector('.rb'));
})();
</script>
</body>
</html>
